[project]
name = "aigpt-mcp"
version = "0.1.0"
description = "MCP server + CLI for ChatGPT image generation via unofficial web backend"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0,<2.0",
    "curl_cffi>=0.7.0",
    "pillow>=10.0.0",
    "pybase64>=1.3.0",
    "tiktoken>=0.7.0",
    "fastapi>=0.110.0",
]

[project.scripts]
aigpt = "aigpt.cli:main"
aigpt-mcp = "aigpt.server:main"
aigpt-api = "aigpt.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigpt"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# Only collect this project's tests. Keeps the upstream checkout under scratch/
# (used by scripts/update-vendor.sh) out of collection.
testpaths = ["tests"]

[tool.ruff]
exclude = ["src/aigpt/_vendor"]

[tool.ruff.lint]
# BLE001/S110 are deliberate in best-effort paths (chmod on FAT, probe fallback,
# enhance fallback) - each has a comment explaining the catch-all.
ignore = ["BLE001", "S110"]

[tool.ruff.lint.isort]
# `services`/`utils` are vendored packages loaded at runtime via
# aigpt._vendor_path (sys.path side effect) - treat them as first-party so isort
# keeps `import aigpt._vendor_path` BEFORE those imports (mandatory ordering).
known-first-party = ["aigpt", "services", "utils"]
